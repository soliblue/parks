name: Verify and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate data, build, and test
        run: npm test

      - name: Deploy production to Cloudflare Pages
        id: deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          DEPLOY_OUTPUT="$(npx wrangler pages deploy dist \
            --project-name=parks \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false)"
          printf '%s\n' "$DEPLOY_OUTPUT"
          DEPLOYMENT_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" |
            grep -Eo 'https://[[:alnum:].-]+\.pages\.dev' |
            tail -n 1)"
          test -n "$DEPLOYMENT_URL"
          printf 'deployment_url=%s\n' "$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify immutable deployment and custom domain
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          for URL in "$DEPLOYMENT_URL" "https://parks.soli.blue"; do
            curl --fail --silent --show-error --location \
              --retry 20 --retry-delay 5 --retry-all-errors "$URL/" > /dev/null
            curl --fail --silent --show-error --location \
              --retry 20 --retry-delay 5 --retry-all-errors \
              "$URL/data/summary.json" |
              node -e 'let body="";process.stdin.on("data",chunk=>body+=chunk).on("end",()=>{const value=JSON.parse(body);if(value.schemaVersion!==1||value.city!=="Berlin")process.exit(1)})'
          done
